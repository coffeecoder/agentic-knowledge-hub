services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: akh
      POSTGRES_USER: akh
      POSTGRES_PASSWORD: akh
    ports:
      - "5432:5432"
    volumes:
      - akh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akh -d akh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  akh-postgres:


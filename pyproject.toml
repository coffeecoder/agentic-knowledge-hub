[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-knowledge-hub"
version = "0.1.0"
description = "Citation-first enterprise knowledge platform on Google Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "google-cloud-aiplatform>=1.71,<2",
  "google-cloud-storage>=2.18,<4",
  "google-cloud-pubsub>=2.23,<3",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1", "mypy>=1.13,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/akh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


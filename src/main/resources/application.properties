spring.application.name=agentic-knowledge-hub
server.port=${PORT:8000}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
akh.chunking.max-words=${CHUNK_SIZE_WORDS:550}
akh.chunking.overlap-words=${CHUNK_OVERLAP_WORDS:90}
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
akh.processing-revision=${PROCESSING_REVISION:parsers-v1/chunker-v2}
akh.source.tenant=${AKH_TENANT:local}
akh.source.name=${AKH_SOURCE_NAME:manual-text}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/akh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:akh}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:akh}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=20
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
# Prevent lower-level SQL/bind diagnostics from exposing document data.
logging.level.org.springframework.jdbc=OFF
logging.level.org.postgresql=OFF
logging.level.com.zaxxer.hikari=OFF

akh.identity.project-id=${GCP_PROJECT_ID:agentic-knowledge-hub-learning}
springdoc.swagger-ui.persist-authorization=false
logging.level.org.springframework.security=OFF

# Embeddings are opt-in. Local providers do not load Google ADC.
akh.embedding.provider=${EMBEDDING_PROVIDER:none}
akh.embedding.revision=${EMBEDDING_REVISION:v1}
akh.embedding.timeout-seconds=${EMBEDDING_TIMEOUT_SECONDS:15}
akh.embedding.attempts=${EMBEDDING_ATTEMPTS:2}
akh.embedding.max-chunks=${EMBEDDING_MAX_CHUNKS:16}
akh.embedding.vertex.project=${VERTEX_PROJECT_ID:${GCP_PROJECT_ID:agentic-knowledge-hub-learning}}
akh.embedding.vertex.location=${VERTEX_LOCATION:us-central1}
akh.embedding.vertex.model=${VERTEX_EMBEDDING_MODEL:gemini-embedding-001}
akh.embedding.ollama.url=${OLLAMA_EMBEDDING_URL:http://localhost:11434/api/embed}
akh.embedding.ollama.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}
# Prefixes are model-specific; changing them changes the vector-space identity.
akh.embedding.ollama.document-prefix=${OLLAMA_DOCUMENT_PREFIX:search_document: }
akh.embedding.ollama.query-prefix=${OLLAMA_QUERY_PREFIX:search_query: }
logging.level.com.google.auth=OFF
logging.level.com.google.api.client=OFF
